<div class="container-list-container">
    <div class="container-header">
        <h2>Docker Containers</h2>
        <button id="refresh-containers" class="refresh-button">
            <span class="refresh-icon">🔄</span> 새로고침
        </button>
    </div>
    <div class="container-list">
        <table id="container-table">
            <thead>
                <tr>
                    <th>CONTAINER ID</th>
                    <th>IMAGE</th>
                    <th>COMMAND</th>
                    <th>STATUS</th>
                    <th>PORTS</th>
                    <th>NAMES</th>
                    <th>작업</th>
                </tr>
            </thead>
            <tbody id="container-list">
                <!-- 컨테이너 목록이 여기에 동적으로 추가됩니다 -->
            </tbody>
        </table>
    </div>
</div>
